# Подписанный policy bundle: источник доверия для четырёх глаз (threat-model T-24, docs/07-governance/ci-four-eyes.md).
# По каждому push в main: (plan) найти слитый PR, заново проверить его одобрения по правилам ПРЕДЫДУЩЕГО подписанного bundle
# и цепочку «предыдущий bundle -> этот коммит»; (sign) в environment policy-signing, где нужен ревьюер и лежит ключ,
# подписать манифест и опубликовать релиз policy-bundle-N с провенансом. Нет подписи — нет релиза у сборки из этого коммита.
# B0 берётся из релиза и привязывается к истории main командами git до сборки (предок S^ и origin/main, тег = commit bundle);
# ключи для проверки предыдущего bundle читаются из B0, ключи для подписи нового — из проверяемого коммита.
# Проверяющий (aegis-ci) собирается из коммита предыдущего bundle (B0), а не из проверяемого коммита S: изменение кода проверки
# в S не влияет на проверку S. Файл самого workflow берётся из S: при обходе ruleset'а администратором единственный барьер —
# ручное подтверждение ревьюера environment (он смотрит diff B0..S, который plan пишет в сводку).
# Genesis (первого bundle) автоматически не выбирается никогда: только workflow_dispatch с genesis=true и confirm=genesis,
# и только если тегов policy-bundle-* нет. Проверяющий для genesis собирается из S: предыдущего bundle нет.
# Цепочка требует squash-merge (ruleset разрешает только его): коммит main — единственный merge-коммит своего PR.
# Прогон отменённого или упавшего коммита перезапускается из интерфейса Actions (Re-run) в порядке коммитов.
name: policy-bundle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      genesis:
        description: "Первый bundle цепочки (допустим, только если тегов policy-bundle-* нет)"
        type: boolean
        default: false
      confirm:
        description: "Для genesis введите: genesis"
        type: string
        default: ""

permissions: {}

# Прогоны идут строго по очереди и не отменяются: пропуск коммита рвёт цепочку.
concurrency:
  group: policy-bundle
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      sequence: ${{ steps.plan.outputs.sequence }}
      b0: ${{ steps.prev.outputs.b0 }}
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Предыдущий подписанный bundle
        id: prev
        env:
          EVENT: ${{ github.event_name }}
          GENESIS: ${{ inputs.genesis }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          # Два источника: теги и опубликованные релизы (все страницы). Они должны совпадать, иначе отказ.
          git tag -l 'policy-bundle-*' | sort > "$RUNNER_TEMP/tags.txt"
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name | select(startswith("policy-bundle-"))' \
            | sort > "$RUNNER_TEMP/releases.txt"
          if grep -qvE '^policy-bundle-[0-9]+$' "$RUNNER_TEMP/tags.txt" "$RUNNER_TEMP/releases.txt"; then
            echo "::error::Тег или релиз policy-bundle-* с нечисловым номером"
            exit 1
          fi
          if ! diff -u "$RUNNER_TEMP/tags.txt" "$RUNNER_TEMP/releases.txt"; then
            echo "::error::Теги и релизы policy-bundle-* не совпадают: тег без релиза или релиз без тега"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/tags.txt" ]; then
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$GENESIS" = "true" ] && [ "$CONFIRM" = "genesis" ]; then
              echo "Genesis: подтверждён вручную, тегов policy-bundle-* нет"
              echo "genesis=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Нет предыдущего bundle: genesis только через workflow_dispatch с genesis=true и confirm=genesis"
            exit 1
          fi
          if [ "$GENESIS" = "true" ]; then
            echo "::error::Genesis запрещён: теги policy-bundle-* уже есть"
            exit 1
          fi
          num="$(sed 's/^policy-bundle-//' "$RUNNER_TEMP/tags.txt" | sort -n | tail -n 1)"
          mkdir -p "$RUNNER_TEMP/prev"
          gh release download "policy-bundle-$num" --repo "$REPO" -p policy-bundle.json -D "$RUNNER_TEMP/prev"
          # Коммит предыдущего bundle читается без кода из проверяемого коммита; подпись проверит уже бинарь из B0.
          b0="$(jq -r .commit "$RUNNER_TEMP/prev/policy-bundle.json")"
          if ! printf '%s' "$b0" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::В предыдущем bundle некорректный commit"
            exit 1
          fi
          git cat-file -e "$b0^{commit}"
          echo "genesis=false" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/prev/policy-bundle.json" >> "$GITHUB_OUTPUT"
          echo "b0=$b0" >> "$GITHUB_OUTPUT"
          echo "num=$num" >> "$GITHUB_OUTPUT"
      # До сборки из B0 (и до любого кода из B0 или S) B0 привязывается к main и к тегу только командами git: релиз и тег
      # может создать любой пользователь с правом write, поэтому commit из неподписанного файла сам по себе не доверие.
      # Главный якорь: B0 — предок родителя проверяемого коммита и предок origin/main, а на main без двух одобрений не попасть.
      - name: Привязка B0 к main и к тегу
        if: steps.prev.outputs.b0 != ''
        env:
          B0: ${{ steps.prev.outputs.b0 }}
          NUM: ${{ steps.prev.outputs.num }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$B0" "$GITHUB_SHA^"; then
            echo "::error::Коммит предыдущего bundle $B0 не предок родителя $GITHUB_SHA: bundle не из истории main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$B0" origin/main; then
            echo "::error::Коммит предыдущего bundle $B0 не в истории origin/main"
            exit 1
          fi
          tag="$(git rev-parse --verify --quiet "refs/tags/policy-bundle-$NUM^{commit}" || true)"
          if [ "$tag" != "$B0" ]; then
            echo "::error::Тег policy-bundle-$NUM указывает на '$tag', а bundle выпущен для $B0"
            exit 1
          fi
      # Ключи для проверки предыдущего bundle — из коммита B0 (отдельный каталог), а не из проверяемого коммита.
      - name: Ключи предыдущего bundle из B0
        if: steps.prev.outputs.b0 != ''
        env:
          B0: ${{ steps.prev.outputs.b0 }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/b0keys"
          mkdir -p "$d"
          git show "$B0:deploy/policy-bundle/keys.json" > "$d/keys.json"
          for p in $(jq -r '.[].path' "$d/keys.json"); do
            case "$p" in
              /* | *..*)
                echo "::error::Недопустимый путь ключа в keys.json коммита B0: $p"
                exit 1
                ;;
            esac
            mkdir -p "$d/$(dirname "$p")"
            git show "$B0:deploy/policy-bundle/$p" > "$d/$p"
          done
      - name: Проверяющий aegis-ci из коммита предыдущего bundle
        env:
          B0: ${{ steps.prev.outputs.b0 }}
        run: |
          set -euo pipefail
          if [ -n "$B0" ]; then
            git worktree add --detach "$RUNNER_TEMP/b0" "$B0"
            (cd "$RUNNER_TEMP/b0" && go build -o "$RUNNER_TEMP/aegis-ci" ./cmd/aegis-ci)
          else
            # Genesis: предыдущего bundle нет, проверяющий собирается из проверяемого коммита.
            go build -o "$RUNNER_TEMP/aegis-ci" ./cmd/aegis-ci
          fi
      - name: Изменения проверки между bundle и коммитом (для ревьюера environment)
        env:
          B0: ${{ steps.prev.outputs.b0 }}
        run: |
          set -euo pipefail
          {
            echo "## Проверка policy bundle: коммит $GITHUB_SHA"
            if [ -n "$B0" ]; then
              echo "Предыдущий bundle: коммит $B0. Ревьюер environment: подтверждайте, только если ниже нет изменений .github/, cmd/aegis-ci/, internal/foureyes/, internal/bundle/ без отдельного PR с четырьмя глазами."
              echo '```'
              git diff --stat "$B0" "$GITHUB_SHA" -- .github cmd/aegis-ci internal/foureyes internal/bundle
              echo '```'
            else
              echo "Genesis: предыдущего bundle нет, проверяющий собран из этого коммита."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: PR коммита
        id: pr
        run: |
          set -euo pipefail
          # Нет PR — не ошибка этого шага: bundle plan сам откажет, если защищённые пути менялись в обход PR.
          pr="$("$RUNNER_TEMP/aegis-ci" bundle find-pr -repo "$REPO" -sha "$GITHUB_SHA" || true)"
          if [ -n "$pr" ]; then
            git fetch --no-tags origin "refs/pull/$pr/head"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: План подписи
        id: plan
        env:
          GENESIS: ${{ steps.prev.outputs.genesis }}
          PREV: ${{ steps.prev.outputs.path }}
        run: |
          set -euo pipefail
          args=(-repo "$REPO" -sha "$GITHUB_SHA" -git-dir . -keys deploy/policy-bundle/keys.json
            -out "$RUNNER_TEMP/unsigned.json" -github-output "$GITHUB_OUTPUT")
          if [ "$GENESIS" = "true" ]; then
            args+=(-genesis)
          else
            args+=(-prev "$PREV" -prev-keys "$RUNNER_TEMP/b0keys/keys.json")
          fi
          "$RUNNER_TEMP/aegis-ci" bundle plan "${args[@]}"
      - name: Неподписанный манифест
        if: steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-bundle
          path: ${{ runner.temp }}/unsigned.json
          retention-days: 7
          if-no-files-found: error

  sign:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ключ — секрет environment policy-signing: required reviewer, запрет самоодобрения, только ветка main.
    environment: policy-signing
    permissions:
      contents: write # релиз policy-bundle-N
      id-token: write # провенанс (Sigstore)
      attestations: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # нужен коммит предыдущего bundle
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-bundle
          path: ${{ runner.temp }}/in
      - name: Проверяющий aegis-ci из коммита предыдущего bundle
        env:
          B0: ${{ needs.plan.outputs.b0 }}
        run: |
          set -euo pipefail
          if [ -n "$B0" ]; then
            git worktree add --detach "$RUNNER_TEMP/b0" "$B0"
            (cd "$RUNNER_TEMP/b0" && go build -o "$RUNNER_TEMP/aegis-ci" ./cmd/aegis-ci)
          else
            go build -o "$RUNNER_TEMP/aegis-ci" ./cmd/aegis-ci # genesis
          fi
      - name: Подпись
        env:
          KEY: ${{ secrets.POLICY_BUNDLE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/k.pem"
          "$RUNNER_TEMP/aegis-ci" bundle sign -in "$RUNNER_TEMP/in/unsigned.json" -key-file "$RUNNER_TEMP/k.pem" \
            -issuer ci/policy-signing -keys deploy/policy-bundle/keys.json -tree . -out policy-bundle.json
      - name: Удаление ключа
        if: always()
        run: rm -f "$RUNNER_TEMP/k.pem"
      - name: Провенанс bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: policy-bundle.json
      - name: Релиз policy-bundle
        env:
          SEQ: ${{ needs.plan.outputs.sequence }}
        run: |
          set -euo pipefail
          gh release create "policy-bundle-$SEQ" policy-bundle.json --repo "$REPO" --target "$GITHUB_SHA" \
            --title "policy bundle $SEQ" \
            --notes "Подписанный policy bundle $SEQ для коммита $GITHUB_SHA. Проверка: aegis-ci bundle verify (docs/07-governance/ci-four-eyes.md)."
