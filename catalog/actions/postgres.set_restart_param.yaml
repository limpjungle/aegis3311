# Параметры СУБД с рестартом, R3, не выше L1 (docs/03-autonomy/action-catalog.md §2.6).
name: postgres.set_restart_param
version: 1.0.0
reversibility: R3
targets:
  kinds: [postgresql-cluster]
params:
  parameter:
    type: string
    enum: [max_connections, shared_buffers]
    chosen_by: model
  value:
    chosen_by: catalog
    depends_on: parameter
    variants:
      max_connections: {type: int, maximum: "ограничение по памяти: work_mem × value ≤ доля RAM (предложение)"}
      shared_buffers: {type: size, maximum: "40% RAM", recommendation_only: true}   # граница из §2.2 архитектуры
step:
  # +25% (предложение); итог подтверждает человек (L1). Для shared_buffers правила нет: нужны данные о RAM, только рекомендация
  - {param: value, when: {parameter: max_connections}, rule: postgres.max_connections.v1, expr: "min(2 * current, ceil(current * 1.25))"}
preconditions:
  - {id: human.confirmed, description: "подтверждение человека с ролью, разрешённой политикой (L1)"}
  - {id: change_window.open, description: "окно изменений открыто, change freeze не действует (ITSM)"}
  - {id: replica.sync_backup, description: "реплика в синхронном состоянии; свежий бэкап подтверждён (проверку восстановления ведёт отдельный контур)"}
  - {id: replicas.max_connections_gte_primary, description: "для max_connections: значение на репликах не меньше, чем на primary"}
postconditions:
  window: 30m
  checks:
    - {id: cluster.available, description: "кластер доступен, репликация восстановлена"}
    - {id: param.applied, description: "параметр применён (pg_settings, pending_restart = false)"}
rollback:
  action: postgres.set_restart_param   # тоже R3 и тоже L1: повторный рестарт
  params: {value: snapshot.value}
execution: gitops   # манифест оператора PostgreSQL; рестарт выполняет оператор
rate_limit: {per_target_per_hour: 1, cooldown: 24h}
blast_radius: {targets_per_call: 1}
lease: required
error_budget_exhausted: frozen
degraded_mode: forbidden
snapshot: [pg_settings, replication_state, last_backup_id]
